<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Құлаған мысалдар — басқару</title>
<style>
:root { --bg: #f4f6f4; --fg: #17362a; --line: #d5ddd8; --muted: #5e7368; --bad: #b3261e; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px system-ui, sans-serif; padding: 24px max(16px, env(safe-area-inset-left)); }
main { max-width: 760px; margin: 0 auto; display: grid; gap: 16px; }
h1 { margin: 0; font-size: 1.5rem; }
p { margin: 0; color: var(--muted); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; }
input, button { font: inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); }
button { background: var(--fg); color: #fff; border: 0; cursor: pointer; }
button.danger { background: var(--bad); }
button.small { padding: 4px 10px; background: transparent; color: var(--bad); border: 1px solid var(--line); }
.wrapt { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; background: #fff; font-variant-numeric: tabular-nums; }
td, th { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
#msg { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Құлаған мысалдар: басқару</h1>
  <p>Мұнда әдепсіз атты не нәтижені өшіруге және жаңа турнир алдында кестені тазалауға болады.</p>
  <div class="bar">
    <input id="pin" type="password" placeholder="Мұғалімнің PIN-і" autocomplete="off">
    <button id="load">Нәтижелерді көрсету</button>
    <button id="reset" class="danger">Барлығын тазалау</button>
  </div>
  <p id="msg"></p>
  <div class="wrapt"><table><thead><tr><th>Уақыт</th><th>Сынып</th><th>Аты</th><th>Ұпай</th><th>Дұрыс/қате</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
let resetArmed = false;
async function call(path, extra = {}) {
  const r = await fetch('/api/admin/' + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin: $('pin').value, ...extra }) });
  const j = await r.json(); if (!r.ok) throw new Error(j.error); return j;
}
async function load() {
  $('msg').textContent = '';
  try {
    const { results } = await call('list');
    $('rows').innerHTML = results.map(r => `<tr>
      <td>${new Date(r.t).toLocaleString('kk-KZ', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</td>
      <td>${esc(r.cls)}</td><td>${esc(r.name)}</td><td>${r.score}</td><td>${r.correct}/${r.wrong}</td>
      <td><button class="small" data-id="${r.id}">Өшіру</button>
          <button class="small" data-player="${esc(r.cls + '|' + r.name)}">Ойыншыны өшіру</button></td></tr>`).join('')
      || '<tr><td colspan="6">Әзірге нәтиже жоқ</td></tr>';
  } catch (e) { $('msg').textContent = e.message; }
}
$('load').onclick = load;
$('rows').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  try { await call('delete', b.dataset.id ? { id: b.dataset.id } : { player: b.dataset.player }); load(); }
  catch (err) { $('msg').textContent = err.message; }
};
$('reset').onclick = async () => {
  if (!resetArmed) { resetArmed = true; $('reset').textContent = 'Шынымен тазалау керек пе? Тағы басыңыз'; setTimeout(() => { resetArmed = false; $('reset').textContent = 'Барлығын тазалау'; }, 4000); return; }
  try { await call('reset'); resetArmed = false; $('reset').textContent = 'Барлығын тазалау'; load(); }
  catch (e) { $('msg').textContent = e.message; }
};
</script>
</body>
</html>
